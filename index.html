<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشافعي الصغير - اختبار إلكتروني</title>
    <!-- استدعاء مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء خط Cairo الاحترافي والواضح -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            /* استخدام رابط Thumbnail لتخطي حظر جوجل درايف */
            --bg-image: url('background.jpg'), url('https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w1920'); 
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1e293b; /* لون بديل في حال تأخر تحميل الصورة */
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* طبقة داكنة فوق الخلفية لتوضيح النصوص */
        .overlay {
            background: rgba(15, 23, 42, 0.6); /* لون كحلي داكن شفاف */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            min-height: 100vh;
        }

        /* تأثير الزجاج */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        .hidden-section { display: none !important; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .option-btn {
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: #10b981; /* لون أخضر للإجابة المحددة */
            border-color: #34d399;
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.6;
        }

        /* تنسيق المؤقت الدائري */
        .timer-svg {
            transform: rotate(-90deg);
            width: 70px;
            height: 70px;
        }
        .timer-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 8;
        }
        .timer-circle-fg {
            fill: none;
            stroke: #facc15; /* لون أصفر */
            stroke-width: 8;
            stroke-dasharray: 283; /* محيط الدائرة تقريباً */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.5s;
        }

        .swal2-popup {
            font-family: 'Cairo', sans-serif !important;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="p-4 sm:p-8 relative">
    <!-- الطبقة الداكنة -->
    <div class="overlay"></div>

    <div class="flex-grow flex flex-col items-center justify-center w-full z-10 relative">
        
        <!-- شاشة البداية -->
        <div id="intro-screen" class="glass-panel w-full max-w-2xl p-8 flex flex-col items-center text-center fade-in">
            <!-- اللوجو -->
            <div class="w-32 h-32 mb-6 rounded-full border-4 border-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.4)] overflow-hidden bg-white flex items-center justify-center">
                <!-- استخدام رابط Thumbnail للوجو -->
                <img src="logo.png" onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w500'" alt="اللوجو" class="w-full h-full object-cover">
            </div>
            
            <h1 class="text-3xl md:text-4xl font-bold mb-2 text-yellow-400">منصة الشافعي الصغير</h1>
            <h2 class="text-xl md:text-2xl font-semibold mb-8 text-gray-200">تحت إدارة أ. أبو بكر الشافعي</h2>
            
            <div class="w-full mb-6 text-right">
                <label for="student-name" class="block mb-2 font-bold text-lg text-gray-200">اسم الطالب ثلاثي:</label>
                <input type="text" id="student-name" placeholder="أدخل اسمك ثلاثي هنا..." class="w-full p-4 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-white/20 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 text-lg transition">
            </div>

            <div class="bg-blue-900/50 border border-blue-400/50 text-blue-100 px-4 py-3 rounded-lg mb-8 w-full flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span class="font-bold" id="attempts-info">لديك 6 محاولات فقط لاجتياز هذا الاختبار.</span>
            </div>

            <button id="start-btn" onclick="confirmStartQuiz()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold text-2xl py-4 rounded-lg shadow-lg transform transition hover:scale-105">
                ابدأ الاختبار الآن
            </button>
        </div>

        <!-- شاشة الاختبار -->
        <div id="quiz-screen" class="glass-panel w-full max-w-4xl p-6 md:p-10 hidden-section fade-in relative">
            
            <!-- الرأس (المؤقت والسؤال) -->
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
                <div class="text-xl font-bold bg-white/10 px-4 py-2 rounded-lg text-gray-200">
                    السؤال: <span id="current-question-num" class="text-yellow-400">1</span> / <span id="total-questions">10</span>
                </div>
                
                <div id="motivation-text" class="hidden md:block text-xl font-bold text-green-400 text-center flex-grow mx-4">
                    توكل على الله!
                </div>

                <!-- المؤقت الدائري -->
                <div class="relative flex items-center justify-center">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="timer-circle" class="timer-circle-fg" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span id="timer-text" class="font-bold text-sm tracking-wider">30:00</span>
                    </div>
                </div>
            </div>

            <div class="min-h-[250px] flex flex-col justify-center mb-8">
                <h3 id="question-text" class="question-text text-center mb-8 text-white">
                    نص السؤال يظهر هنا
                </h3>
                <div id="options-container" class="grid grid-cols-1 gap-4 w-full max-w-2xl mx-auto">
                    <!-- الخيارات تُضاف برمجياً -->
                </div>
            </div>

            <div class="flex justify-between mt-8 pt-6 border-t border-white/10">
                <button onclick="prevQuestion()" id="prev-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition hidden text-lg">
                    السابق
                </button>
                <div class="flex-grow"></div>
                <button onclick="handleNextClick()" id="next-btn" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-12 rounded-lg transition text-xl shadow-[0_4px_15px_rgba(234,179,8,0.3)]">
                    التالي
                </button>
            </div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-screen" class="glass-panel w-full max-w-3xl p-8 flex flex-col items-center text-center hidden-section fade-in">
            <h2 class="text-4xl font-bold mb-6" id="result-title">النتيجة النهائية</h2>
            <div class="text-2xl font-bold mb-6 text-gray-300">الطالب: <span id="display-name" class="text-yellow-400"></span></div>
            
            <div class="w-40 h-40 rounded-full flex items-center justify-center text-5xl font-black mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)] border-8" id="score-circle">
                <span id="score-text">0%</span>
            </div>

            <p id="result-message" class="text-2xl font-bold mb-8"></p>

            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center flex-wrap">
                <button onclick="showReview()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition text-lg w-full sm:w-auto">
                    مراجعة الإجابات
                </button>
                <button onclick="retryQuiz()" id="retry-btn" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-8 rounded-lg transition text-lg w-full sm:w-auto">
                    إعادة الاختبار
                </button>
                <button onclick="resetAndPractice()" id="practice-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition text-sm w-full mt-2">
                    نسيت الدرس؟ (إعادة تعيين للتدريب)
                </button>
            </div>
        </div>

        <!-- شاشة المراجعة -->
        <div id="review-screen" class="glass-panel w-full max-w-4xl p-6 md:p-10 hidden-section fade-in">
            <h2 class="text-3xl font-bold mb-6 text-center text-yellow-400 border-b border-white/10 pb-4">مراجعة الإجابات</h2>
            <div id="review-container" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <!-- تُضاف الإجابات برمجياً -->
            </div>
            <div class="mt-8 text-center border-t border-white/10 pt-6">
                <button onclick="backToResults()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-12 rounded-lg transition text-lg">
                    العودة للنتيجة
                </button>
            </div>
        </div>
    </div>

    <!-- حقوق التنفيذ باللغة الإنجليزية، بحجم مناسب وأنيق -->
    <footer class="mt-auto py-4 text-center z-10 w-full">
        <p class="text-sm md:text-base text-gray-300 tracking-wide font-sans opacity-80 hover:opacity-100 transition duration-300">
            Executed by <span class="text-yellow-400 font-semibold">Abdelhalim El-Fakharany</span>
        </p>
    </footer>

    <script>
        // ===== مساعد آمن للتخزين (يمنع توقف الكود لو التخزين محظور) =====
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }
        function safeRemove(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }

        // ===== نافذة تنبيه احتياطية لو مكتبة SweetAlert لم تُحمَّل =====
        const hasSwal = () => typeof Swal !== 'undefined';

        // إعدادات الصوت باستخدام Web Audio API
        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'next') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) { console.log("Audio not supported"); }
        }

        const PASSING_SCORE = 35;
        const MAX_ATTEMPTS = 6;
        const TIME_LIMIT = 30 * 60;
        const ATTEMPTS_KEY = 'shafei_quiz_attempts_v2';
        const STATE_KEY = 'shafei_quiz_state_v2';

        const motivations = [
            "توكل على الله، أنت تستطيع!",
            "ركز جيداً، الإجابة بين يديك.",
            "استعن بالله ولا تعجز.",
            "اقرأ السؤال بتمعن، ففهم السؤال نصف الإجابة."
        ];

        const questions = [
            { q: "النهي في قوله ﷺ: «لا تسبوا» مقتصر على الصحابة الموجودين في زمن النبي ﷺ فقط.", options: ["صح", "خطأ"], answer: "خطأ" },
            { q: "ذهب جمهور الصحابة إلى القول بأن من سبَّ الصحابة يُقتل.", options: ["صح", "خطأ"], answer: "خطأ" },
            { q: "المُدُّ، بضم الميم، ربع الصاع.", options: ["صح", "خطأ"], answer: "صح" },
            { q: "الغبطة هي أن يتمنى الإنسان لنفسه ما عند غيره مع زوال النعمة عنه.", options: ["صح", "خطأ"], answer: "خطأ" },
            { q: "شُبِّه الساعي على الأرملة والمسكين بالمجاهد في سبيل الله؛ لاجتماعهما في الكدّ والتعب.", options: ["صح", "خطأ"], answer: "صح" },
            { q: "المراد بالحكمة في: «آتاه الله الحكمة»", options: ["القرآن", "العلم", "كل ما سبق"], answer: "كل ما سبق" },
            { q: "«فسلَّطه على هلكته في…»:", options: ["التبذير", "الحق", "وجوه المكارة"], answer: "الحق" },
            { q: "ورد نصب كلمة «رجلًا» بتقدير «أعني» في رواية:", options: ["مسلم", "النسائي", "ابن ماجه"], answer: "ابن ماجه" },
            { q: "ذكر البخاري حديث الساعي على الأرملة والمسكين كالمجاهد في سبيل الله تحت باب:", options: ["الجهاد", "الصيام", "فضل النفقة على الأهل"], answer: "فضل النفقة على الأهل" },
            { q: "المسكين هو الذي:", options: ["لا مال له", "يملك قوت يومه", "له مال كثير"], answer: "لا مال له" }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeRemaining = TIME_LIMIT;
        let timerInterval = null;
        let studentName = "";
        let practiceMode = false;
        let currentAttempts = parseInt(safeGet(ATTEMPTS_KEY)) || 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-questions').innerText = questions.length;
            updateAttemptsUI();
            checkPreviousState();
        });

        // ===== أدوات التنقل بين الشاشات =====
        function showScreen(id) {
            ['intro-screen', 'quiz-screen', 'result-screen', 'review-screen'].forEach(s => {
                document.getElementById(s).classList.add('hidden-section');
            });
            document.getElementById(id).classList.remove('hidden-section');
        }

        function checkPreviousState() {
            let savedState = null;
            try { savedState = JSON.parse(safeGet(STATE_KEY)); } catch (e) {}
            if (savedState && savedState.passed) {
                studentName = savedState.name;
                if (Array.isArray(savedState.answers)) userAnswers = savedState.answers;
                showFinalResultUI(savedState.score, true);
            }
        }

        function updateAttemptsUI() {
            const remaining = MAX_ATTEMPTS - currentAttempts;
            const attemptsInfo = document.getElementById('attempts-info');
            const startBtn = document.getElementById('start-btn');

            if (practiceMode) {
                attemptsInfo.innerText = 'وضع التدريب: هذه المحاولة لا تُحتسب ولا تُحفظ.';
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            if (currentAttempts >= MAX_ATTEMPTS) {
                attemptsInfo.innerHTML = `<span class="text-red-400">لقد استنفدت جميع محاولاتك (${MAX_ATTEMPTS}).</span>`;
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                attemptsInfo.innerText = `لديك ${MAX_ATTEMPTS} محاولات، المتبقي: ${remaining}`;
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function showAlert(opts) {
            if (hasSwal()) return Swal.fire(opts);
            alert(opts.text || opts.title || '');
            return Promise.resolve({ isConfirmed: true });
        }

        function confirmStartQuiz() {
            playSound('select');
            const nameInput = document.getElementById('student-name').value.trim();
            const words = nameInput.split(/\s+/).filter(Boolean);
            if (words.length < 3) {
                playSound('error');
                showAlert({ icon: 'warning', title: 'تنبيه', text: 'الرجاء إدخال اسم الطالب ثلاثي بشكل صحيح!', confirmButtonText: 'حسناً', confirmButtonColor: '#eab308' });
                return;
            }
            if (!practiceMode && currentAttempts >= MAX_ATTEMPTS) return;

            // لو المكتبة لم تُحمَّل نبدأ مباشرة بدون نافذة التأكيد
            if (!hasSwal()) {
                studentName = nameInput;
                startQuizConfirmed();
                return;
            }

            Swal.fire({
                title: 'جاهز؟',
                text: 'سيبدأ المؤقت فور دخولك.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'نعم، ابدأ',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    playSound('next');
                    studentName = nameInput;
                    startQuizConfirmed();
                }
            });
        }

        function startQuizConfirmed() {
            try {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            } catch (err) {}

            // تصفير حالة الاختبار
            userAnswers = new Array(questions.length).fill(null);
            timeRemaining = TIME_LIMIT;
            const timerText = document.getElementById('timer-text');
            const timerCircle = document.getElementById('timer-circle');
            timerText.innerText = '30:00';
            timerText.classList.remove('text-red-400', 'animate-pulse');
            timerCircle.style.strokeDashoffset = 0;
            timerCircle.style.stroke = '#facc15';

            // احتساب المحاولة فور البدء حتى لا يُعاد تحميل الصفحة للهروب منها
            if (!practiceMode) {
                currentAttempts++;
                safeSet(ATTEMPTS_KEY, String(currentAttempts));
            }

            showScreen('quiz-screen');
            startTimer();
            loadQuestion(0);
        }

        function startTimer() {
            const timerText = document.getElementById('timer-text');
            const timerCircle = document.getElementById('timer-circle');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;
                timerText.innerText = `${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

                // تحديث الدائرة
                const dashoffset = 283 - (283 * timeRemaining / TIME_LIMIT);
                timerCircle.style.strokeDashoffset = dashoffset;

                if (timeRemaining <= 60) {
                    timerCircle.style.stroke = '#ef4444'; // يتحول للأحمر في آخر دقيقة
                    timerText.classList.add('text-red-400', 'animate-pulse');
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz(true);
                }
            }, 1000);
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = questions[index];
            document.getElementById('current-question-num').innerText = index + 1;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('motivation-text').innerText = motivations[Math.floor(Math.random() * motivations.length)];

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-right p-4 rounded-lg ${userAnswers[index] === opt ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => {
                    playSound('select');
                    userAnswers[currentQuestionIndex] = opt;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });

            const prevBtn = document.getElementById('prev-btn');
            index === 0 ? prevBtn.classList.add('hidden') : prevBtn.classList.remove('hidden');

            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerText = 'إنهاء وتسليم';
                nextBtn.classList.replace('bg-yellow-500', 'bg-green-500');
                nextBtn.classList.replace('hover:bg-yellow-400', 'hover:bg-green-400');
                nextBtn.classList.replace('text-gray-900', 'text-white');
            } else {
                nextBtn.innerText = 'التالي';
                nextBtn.classList.replace('bg-green-500', 'bg-yellow-500');
                nextBtn.classList.replace('hover:bg-green-400', 'hover:bg-yellow-400');
                nextBtn.classList.replace('text-white', 'text-gray-900');
            }
        }

        // ===== التنقل بين الأسئلة =====
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                playSound('next');
                loadQuestion(currentQuestionIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                playSound('next');
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function handleNextClick() {
            if (currentQuestionIndex < questions.length - 1) {
                nextQuestion();
                return;
            }

            // آخر سؤال: تأكيد التسليم
            const unanswered = userAnswers.filter(a => a === null).length;
            const text = unanswered > 0
                ? `لديك ${unanswered} سؤال بدون إجابة. هل تريد التسليم؟`
                : 'هل أنت متأكد من تسليم الاختبار؟';

            if (!hasSwal()) {
                if (confirm(text)) submitQuiz(false);
                return;
            }

            Swal.fire({
                title: 'تسليم الاختبار',
                text: text,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'نعم، سلّم',
                cancelButtonText: 'رجوع'
            }).then((result) => {
                if (result.isConfirmed) submitQuiz(false);
            });
        }

        // ===== التسليم وحساب النتيجة =====
        function submitQuiz(autoSubmit) {
            clearInterval(timerInterval);

            let correct = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.answer) correct++;
            });
            const score = Math.round((correct / questions.length) * 100);
            const passed = score >= PASSING_SCORE;

            // حفظ النتيجة عند النجاح فقط (ولا يُحفظ شيء في وضع التدريب)
            if (passed && !practiceMode) {
                safeSet(STATE_KEY, JSON.stringify({
                    name: studentName,
                    score: score,
                    passed: true,
                    answers: userAnswers
                }));
            }

            try {
                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
            } catch (e) {}

            showFinalResultUI(score, false, autoSubmit);
        }

        function showFinalResultUI(score, fromSaved, autoSubmit) {
            const passed = score >= PASSING_SCORE;
            const circle = document.getElementById('score-circle');
            const title = document.getElementById('result-title');
            const message = document.getElementById('result-message');
            const retryBtn = document.getElementById('retry-btn');

            document.getElementById('display-name').innerText = studentName;
            document.getElementById('score-text').innerText = score + '%';

            circle.classList.remove('border-green-500', 'text-green-400', 'border-red-500', 'text-red-400');
            if (passed) {
                circle.classList.add('border-green-500', 'text-green-400');
                title.innerText = 'مبارك! لقد اجتزت الاختبار';
                message.className = 'text-2xl font-bold mb-8 text-green-400';
                message.innerText = fromSaved
                    ? 'تم حفظ نتيجتك السابقة، بارك الله فيك.'
                    : 'أحسنت، بارك الله فيك ونفع بك.';
            } else {
                circle.classList.add('border-red-500', 'text-red-400');
                title.innerText = autoSubmit ? 'انتهى الوقت' : 'النتيجة النهائية';
                message.className = 'text-2xl font-bold mb-8 text-red-400';
                const remaining = MAX_ATTEMPTS - currentAttempts;
                message.innerText = (!practiceMode && remaining <= 0)
                    ? `لم تحقق درجة النجاح (${PASSING_SCORE}%)، وقد استنفدت جميع محاولاتك.`
                    : `لم تحقق درجة النجاح (${PASSING_SCORE}%)، راجع الدرس وحاول مرة أخرى.`;
            }

            // زر إعادة الاختبار: يُخفى عند النجاح أو انتهاء المحاولات
            const noMoreAttempts = !practiceMode && currentAttempts >= MAX_ATTEMPTS;
            if (passed || noMoreAttempts) retryBtn.classList.add('hidden-section');
            else retryBtn.classList.remove('hidden-section');

            showScreen('result-screen');
        }

        // ===== مراجعة الإجابات =====
        function showReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            questions.forEach((q, i) => {
                const userAns = userAnswers[i];
                const isCorrect = userAns === q.answer;

                const item = document.createElement('div');
                item.className = `p-4 rounded-lg border-2 text-right ${isCorrect ? 'border-green-500/60 bg-green-900/20' : 'border-red-500/60 bg-red-900/20'}`;

                const qEl = document.createElement('p');
                qEl.className = 'font-bold text-lg mb-2 text-white';
                qEl.innerText = `${i + 1}. ${q.q}`;

                const userEl = document.createElement('p');
                userEl.className = isCorrect ? 'text-green-400 font-semibold' : 'text-red-400 font-semibold';
                userEl.innerText = `إجابتك: ${userAns === null || userAns === undefined ? 'لم تُجب' : userAns}`;

                item.appendChild(qEl);
                item.appendChild(userEl);

                if (!isCorrect) {
                    const rightEl = document.createElement('p');
                    rightEl.className = 'text-green-400 font-semibold';
                    rightEl.innerText = `الإجابة الصحيحة: ${q.answer}`;
                    item.appendChild(rightEl);
                }
                container.appendChild(item);
            });

            showScreen('review-screen');
        }

        function backToResults() {
            showScreen('result-screen');
        }

        // ===== إعادة الاختبار (محاولة جديدة تُحتسب) =====
        function retryQuiz() {
            if (!practiceMode && currentAttempts >= MAX_ATTEMPTS) {
                playSound('error');
                showAlert({ icon: 'error', title: 'انتهت المحاولات', text: 'لقد استنفدت جميع محاولاتك.', confirmButtonText: 'حسناً', confirmButtonColor: '#eab308' });
                return;
            }
            userAnswers = new Array(questions.length).fill(null);
            updateAttemptsUI();
            const nameField = document.getElementById('student-name');
            if (studentName) nameField.value = studentName;
            showScreen('intro-screen');
        }

        // ===== إعادة تعيين للتدريب (لا تُحتسب ولا تُحفظ) =====
        function resetAndPractice() {
            const go = () => {
                safeRemove(STATE_KEY);
                practiceMode = true;
                userAnswers = new Array(questions.length).fill(null);
                updateAttemptsUI();
                const nameField = document.getElementById('student-name');
                if (studentName) nameField.value = studentName;
                showScreen('intro-screen');
            };

            if (!hasSwal()) {
                if (confirm('سيبدأ وضع التدريب ولن تُحتسب هذه المحاولة. هل تريد المتابعة؟')) go();
                return;
            }

            Swal.fire({
                title: 'وضع التدريب',
                text: 'سيبدأ اختبار تدريبي لا تُحتسب فيه المحاولة ولا تُحفظ نتيجته.',
                icon: 'info',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'ابدأ التدريب',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) go();
            });
        }
    </script>
